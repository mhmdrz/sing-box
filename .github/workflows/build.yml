name: build-v2ray-api

# Builds sing-box for linux/amd64 and linux/arm64 with the V2Ray API enabled.
# V2Ray API is turned on purely via build tags — no source patch needed.

on:
  push:
    tags:
      - "v*"            # tag pushes (e.g. v1.13.18-v2ray) create a Release
  workflow_dispatch: {} # manual runs from the Actions tab produce artifacts

permissions:
  contents: write        # needed to create Releases on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need tags for version stamping

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Resolve build tags (upstream defaults + V2Ray API)
        id: tags
        run: |
          BASE="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
          echo "tags=${BASE},with_grpc,with_v2ray_api" >> "$GITHUB_OUTPUT"
          echo "Using tags: ${BASE},with_grpc,with_v2ray_api"

      - name: Compute version string
        id: ver
        run: |
          V="$(git describe --tags --always 2>/dev/null || echo dev)"
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          OUT="sing-box-${{ steps.ver.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p dist
          # Upstream's shared linker flags (includes -checklinkname=0, which is
          # REQUIRED for the badtls //go:linkname hack to compile on Go 1.23+).
          LDFLAGS_SHARED="$(cat release/LDFLAGS)"
          go build -v -trimpath \
            -tags "${{ steps.tags.outputs.tags }}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ steps.ver.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            -o "dist/${OUT}/sing-box" \
            ./cmd/sing-box
          # sanity check: confirm v2ray_api is compiled in
          ./dist/${OUT}/sing-box version || true
          cp LICENSE "dist/${OUT}/" 2>/dev/null || true
          tar -C dist -czf "dist/${OUT}.tar.gz" "${OUT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
